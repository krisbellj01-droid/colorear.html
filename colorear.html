<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Colorear - Flor de 6 Pétalos</title>
    <!-- Librería de Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #f3e5f5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #4a148c;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .toolbar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn {
            background-color: #e1bee7;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #4a148c;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: #ce93d8;
            transform: scale(1.05);
        }

        .canvas-box {
            width: 100%;
            height: 350px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            background: #fafafa;
            border-radius: 12px;
            border: 2px dashed #d1c4e9;
        }

        svg {
            max-width: 100%;
            max-height: 100%;
            overflow: visible;
        }

        /* Zonas pintables claras y responsivas */
        .zona-pintable {
            fill: #ffffff;
            stroke: #2d2d2d;
            stroke-width: 3px;
            stroke-linejoin: round;
            stroke-linecap: round;
            transition: filter 0.2s;
            cursor: pointer;
        }

        .zona-pintable:hover {
            filter: brightness(0.92);
        }

        .palette {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .color-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .color-btn:hover {
            transform: scale(1.1);
        }

        .color-btn.active {
            border-color: #212121;
            transform: scale(1.15);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        #mensaje-victoria {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #2e7d32;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>🎨 Rincón de Colorear</h1>
        
        <div class="toolbar">
            <button class="btn" onclick="deshacer()">↶ Deshacer</button>
            <button class="btn" onclick="rehacer()">↷ Rehacer</button>
            <button class="btn" onclick="reiniciar()">🔄 Borrar todo</button>
        </div>

        <!-- Lienzo SVG con flor de 6 pétalos rediseñada -->
        <div class="canvas-box">
            <svg viewBox="0 0 300 300" width="100%" height="100%">
                <!-- Tallo -->
                <path class="zona-pintable" id="tallo" d="M145,170 Q140,225 146,280 L154,280 Q160,225 155,170 Z" />
                
                <!-- Hoja Izquierda -->
                <path class="zona-pintable" id="hoja-izq" d="M144,210 Q100,195 75,210 Q70,230 100,235 Q125,230 144,210 Z" />
                
                <!-- Hoja Derecha -->
                <path class="zona-pintable" id="hoja-der" d="M156,210 Q200,195 225,210 Q230,230 200,235 Q175,230 156,210 Z" />

                <!-- 6 Pétalos simétricos -->
                <path class="zona-pintable" id="petalo-1" d="M150,115 C130,70 120,30 150,15 C180,30 170,70 150,115 Z" />
                <path class="zona-pintable" id="petalo-2" d="M150,115 C185,105 220,90 230,115 C240,140 190,145 150,115 Z" />
                <path class="zona-pintable" id="petalo-3" d="M150,115 C180,145 210,180 190,195 C170,210 145,160 150,115 Z" />
                <path class="zona-pintable" id="petalo-4" d="M150,115 C170,155 160,195 150,210 C140,195 130,155 150,115 Z" />
                <path class="zona-pintable" id="petalo-5" d="M150,115 C120,145 90,180 110,195 C130,210 155,160 150,115 Z" />
                <path class="zona-pintable" id="petalo-6" d="M150,115 C115,105 80,90 70,115 C60,140 110,145 150,115 Z" />

                <!-- Centro de la flor -->
                <circle class="zona-pintable" id="centro" cx="150" cy="115" r="24" />
            </svg>
        </div>

        <!-- Paleta de colores -->
        <div class="palette">
            <div class="color-btn active" style="background-color: #ff4081;" data-color="#ff4081"></div>
            <div class="color-btn" style="background-color: #7b1fa2;" data-color="#7b1fa2"></div>
            <div class="color-btn" style="background-color: #ffeb3b;" data-color="#ffeb3b"></div>
            <div class="color-btn" style="background-color: #4caf50;" data-color="#4caf50"></div>
            <div class="color-btn" style="background-color: #03a9f4;" data-color="#03a9f4"></div>
            <div class="color-btn" style="background-color: #ff9800;" data-color="#ff9800"></div>
            <div class="color-btn" style="background-color: #ffffff; border-color: #ccc;" data-color="#ffffff" title="Borrador"></div>
        </div>

        <div id="mensaje-victoria">✨ ¡Hermosa obra de arte! ¡Completado! 🎉</div>
    </div>

    <script>
        let colorActual = "#ff4081";
        let historial = [];
        let rehacelist = [];

        const zonas = document.querySelectorAll('.zona-pintable');
        const colorBtns = document.querySelectorAll('.color-btn');
        const mensajeVictoria = document.getElementById('mensaje-victoria');

        // Selección de color
        colorBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                colorBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                colorActual = btn.getAttribute('data-color');
            });
        });

        // Evento para pintar al hacer clic
        zonas.forEach(zona => {
            zona.addEventListener('click', (e) => {
                e.stopPropagation();
                
                // Obtener color actual real aplicado
                let colorAnterior = zona.style.fill;
                if (!colorAnterior || colorAnterior === "") {
                    colorAnterior = "#ffffff";
                }

                if (colorAnterior.toLowerCase() !== colorActual.toLowerCase()) {
                    historial.push({ zona: zona, colorAnterior: colorAnterior, colorNuevo: colorActual });
                    rehacelist = []; 

                    zona.style.fill = colorActual;
                    verificarProgreso();
                }
            });
        });

        function deshacer() {
            if (historial.length === 0) return;
            const ultimaAccion = historial.pop();
            rehacelist.push(ultimaAccion);
            ultimaAccion.zona.style.fill = ultimaAccion.colorAnterior;
            mensajeVictoria.style.display = 'none';
        }

        function rehacer() {
            if (rehacelist.length === 0) return;
            const accionRedo = rehacelist.pop();
            historial.push(accionRedo);
            accionRedo.zona.style.fill = accionRedo.colorNuevo;
            verificarProgreso();
        }

        function reiniciar() {
            zonas.forEach(zona => {
                zona.style.fill = '#ffffff';
            });
            historial = [];
            rehacelist = [];
            mensajeVictoria.style.display = 'none';
        }

        function verificarProgreso() {
            let pintadas = 0;
            zonas.forEach(zona => {
                let currentFill = zona.style.fill;
                if (currentFill && currentFill !== '#ffffff' && currentFill !== 'rgb(255, 255, 255)' && currentFill !== 'white') {
                    pintadas++;
                }
            });

            if (pintadas === zonas.length) {
                mensajeVictoria.style.display = 'block';
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            } else {
                mensajeVictoria.style.display = 'none';
            }
        }
    </script>
</body>
</html>
