<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Colorear Interactiva - Flor de 6 Pétalos</title>
    <!-- Librería de Confetti para la celebración -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-color: #7b1fa2;
            --bg-color: #f3e5f5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #4a148c;
            font-size: 24px;
            margin-bottom: 10px;
        }

        /* Barra de herramientas / Controles */
        .toolbar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn {
            background-color: #e1bee7;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #4a148c;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: #ce93d8;
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Lienzo del dibujo SVG */
        .canvas-box {
            width: 100%;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            background: #fafafa;
            border-radius: 12px;
            border: 2px dashed #d1c4e9;
        }

        svg {
            max-width: 100%;
            max-height: 100%;
        }

        /* Estilos de las zonas pintables */
        .zona-pintable {
            fill: #ffffff; /* Color inicial blanco */
            stroke: #212121;
            stroke-width: 2.5px;
            transition: fill 0.3s ease, filter 0.2s;
            cursor: pointer;
        }

        .zona-pintable:hover {
            filter: brightness(0.95);
        }

        /* Paleta de Colores */
        .palette {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .color-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .color-btn:hover {
            transform: scale(1.1);
        }

        .color-btn.active {
            border-color: #212121;
            transform: scale(1.15);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Mensaje de completado */
        #mensaje-victoria {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #2e7d32;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>🎨 Rincón de Colorear</h1>
        
        <!-- Botones de Deshacer / Rehacer -->
        <div class="toolbar">
            <button class="btn" id="btn-undo" onclick="deshacer()">↶ Deshacer</button>
            <button class="btn" id="btn-redo" onclick="rehacer()">↷ Rehacer</button>
            <button class="btn" onclick="reiniciar()">🔄 Borrar todo</button>
        </div>

        <!-- Lienzo con un SVG de una flor de 6 pétalos -->
        <div class="canvas-box">
            <svg viewBox="0 0 200 200">
                <!-- Tallo y Hojas -->
                <path class="zona-pintable" id="tallo" d="M96 110 Q92 150 96 190 L104 190 Q108 150 104 110 Z" />
                <path class="zona-pintable" id="hoja-izq" d="M98 135 Q60 115 65 95 Q85 110 98 135 Z" />
                <path class="zona-pintable" id="hoja-der" d="M102 135 Q140 115 135 95 Q115 110 102 135 Z" />
                
                <!-- 6 Pétalos de la flor distribuidos simétricamente -->
                <path class="zona-pintable" id="petalo-1" d="M100 85 C85 65 75 45 90 35 C105 25 110 50 100 85 Z" />
                <path class="zona-pintable" id="petalo-2" d="M100 85 C115 65 125 45 110 35 C95 25 90 50 100 85 Z" />
                <path class="zona-pintable" id="petalo-3" d="M100 85 C120 85 140 80 140 95 C140 110 115 100 100 85 Z" />
                <path class="zona-pintable" id="petalo-4" d="M100 85 C115 105 125 125 110 135 C95 145 90 120 100 85 Z" />
                <path class="zona-pintable" id="petalo-5" d="M100 85 C85 105 75 125 90 135 C105 145 110 120 100 85 Z" />
                <path class="zona-pintable" id="petalo-6" d="M100 85 C80 85 60 80 60 95 C60 110 85 100 100 85 Z" />
                
                <!-- Centro de la flor -->
                <circle class="zona-pintable" id="centro" cx="100" cy="85" r="16" />
            </svg>
        </div>

        <!-- Paleta de colores interactiva -->
        <div class="palette" id="palette">
            <div class="color-btn active" style="background-color: #7b1fa2;" data-color="#7b1fa2"></div>
            <div class="color-btn" style="background-color: #e91e63;" data-color="#e91e63"></div>
            <div class="color-btn" style="background-color: #ffeb3b;" data-color="#ffeb3b"></div>
            <div class="color-btn" style="background-color: #4caf50;" data-color="#4caf50"></div>
            <div class="color-btn" style="background-color: #03a9f4;" data-color="#03a9f4"></div>
            <div class="color-btn" style="background-color: #ff9800;" data-color="#ff9800"></div>
            <div class="color-btn" style="background-color: #ffffff; border-color: #ccc;" data-color="#ffffff" title="Borrador/Blanco"></div>
        </div>

        <div id="mensaje-victoria">✨ ¡Hermosa obra de arte! ¡Completado! 🎉</div>
    </div>

    <script>
        let colorActual = "#7b1fa2";
        let historial = [];
        let rehacelist = [];

        const zonas = document.querySelectorAll('.zona-pintable');
        const colorBtns = document.querySelectorAll('.color-btn');
        const mensajeVictoria = document.getElementById('mensaje-victoria');

        // 1. Selector de colores dinámico
        colorBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                colorBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                colorActual = btn.getAttribute('data-color');
            });
        });

        // 2. Pintar las zonas al hacer clic
        zonas.forEach(zona => {
            zona.addEventListener('click', () => {
                const colorAnterior = zona.getAttribute('fill');
                
                if (colorAnterior !== colorActual) {
                    // Guardar acción en el historial para el "Deshacer"
                    historial.push({ zona: zona, colorAnterior: colorAnterior, colorNuevo: colorActual });
                    rehacelist = []; // Limpiar rehacer al hacer una nueva acción

                    zona.setAttribute('fill', colorActual);
                    verificarProgreso();
                }
            });
        });

        // 3. Función Deshacer (Undo)
        function deshacer() {
            if (historial.length === 0) return;
            const ultimaAccion = historial.pop();
            rehacelist.push(ultimaAccion);
            ultimaAccion.zona.setAttribute('fill', ultimaAccion.colorAnterior);
            mensajeVictoria.style.display = 'none';
        }

        // 4. Función Rehacer (Redo)
        function rehacer() {
            if (rehacelist.length === 0) return;
            const accionRedo = rehacelist.pop();
            historial.push(accionRedo);
            accionRedo.zona.setAttribute('fill', accionRedo.colorNuevo);
            verificarProgreso();
        }

        // 5. Reiniciar dibujo
        function reiniciar() {
            zonas.forEach(zona => {
                zona.setAttribute('fill', '#ffffff');
            });
            historial = [];
            rehacelist = [];
            mensajeVictoria.style.display = 'none';
        }

        // 6. Verificar si se completó el dibujo para lanzar confeti
        function verificarProgreso() {
            let pintadas = 0;
            zonas.forEach(zona => {
                if (zona.getAttribute('fill') !== '#ffffff') {
                    pintadas++;
                }
            });

            // Si todas las zonas tienen color distinto al blanco, lanzamos confeti
            if (pintadas === zonas.length) {
                mensajeVictoria.style.display = 'block';
                lanzarConfeti();
            } else {
                mensajeVictoria.style.display = 'none';
            }
        }

        // 7. Efecto de confeti con canvas-confetti
        function lanzarConfeti() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }
    </script>
</body>
</html>
