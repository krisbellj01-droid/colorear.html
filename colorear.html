<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Colorear - Flor de 6 Pétalos</title>
    <!-- Incluyendo Tailwind CSS para un diseño limpio y moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería de Confetti para la animación de victoria -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fce7f3;
        }
        .zona-pintable {
            fill: #ffffff;
            stroke: #1f2937;
            stroke-width: 3.5px;
            stroke-linejoin: round;
            stroke-linecap: round;
            transition: filter 0.2s ease, transform 0.1s ease;
            cursor: pointer;
        }
        .zona-pintable:hover {
            filter: brightness(0.92);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-xl max-w-md w-full text-center border border-pink-100">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-pink-700 mb-2">🎨 Rincón de Colorear</h1>
        <p class="text-gray-500 text-sm mb-6">Selecciona un color y da vida a esta hermosa flor simétrica.</p>

        <!-- Barra de herramientas (Deshacer, Rehacer, Borrar todo) -->
        <div class="flex justify-center gap-3 mb-6">
            <button onclick="deshacer()" class="px-4 py-2 bg-pink-100 hover:bg-pink-200 text-pink-800 text-sm font-semibold rounded-xl transition shadow-sm active:scale-95 flex items-center gap-1">
                ↶ Deshacer
            </button>
            <button onclick="rehacer()" class="px-4 py-2 bg-pink-100 hover:bg-pink-200 text-pink-800 text-sm font-semibold rounded-xl transition shadow-sm active:scale-95 flex items-center gap-1">
                ↷ Rehacer
            </button>
            <button onclick="reiniciar()" class="px-4 py-2 bg-red-50 hover:bg-red-100 text-red-700 text-sm font-semibold rounded-xl transition shadow-sm active:scale-95 flex items-center gap-1">
                🔄 Reiniciar
            </button>
        </div>

        <!-- Lienzo SVG con flor de 6 pétalos simétrica perfecta -->
        <div class="bg-gray-50 border-2 border-dashed border-pink-200 rounded-2xl p-4 mb-6 flex justify-center items-center shadow-inner">
            <svg viewBox="0 0 300 300" class="w-full max-w-[280px] h-auto drop-shadow-sm">
                <!-- Tallo -->
                <path class="zona-pintable" id="tallo" d="M145,170 Q140,225 146,280 L154,280 Q160,225 155,170 Z" />
                
                <!-- Hoja Izquierda -->
                <path class="zona-pintable" id="hoja-izq" d="M144,210 Q100,195 75,210 Q70,230 100,235 Q125,230 144,210 Z" />
                
                <!-- Hoja Derecha -->
                <path class="zona-pintable" id="hoja-der" d="M156,210 Q200,195 225,210 Q230,230 200,235 Q175,230 156,210 Z" />

                <!-- 6 Pétalos simétricos calculados matemáticamente desde el centro (150, 115) -->
                <path class="zona-pintable" id="petalo-1" d="M150,115 C150,55 185,25 150,5 C115,25 150,55 150,115 Z" />
                <path class="zona-pintable" id="petalo-2" d="M150,115 C195,115 225,145 250,115 C225,85 195,115 150,115 Z" />
                <path class="zona-pintable" id="petalo-3" d="M150,115 C190,150 220,185 240,210 C210,215 175,180 150,115 Z" />
                <path class="zona-pintable" id="petalo-4" d="M150,115 C150,175 185,205 150,225 C115,205 150,175 150,115 Z" />
                <path class="zona-pintable" id="petalo-5" d="M150,115 C110,150 80,185 60,210 C90,215 125,180 150,115 Z" />
                <path class="zona-pintable" id="petalo-6" d="M150,115 C105,115 75,145 50,115 C75,85 105,115 150,115 Z" />

                <!-- Centro de la flor -->
                <circle class="zona-pintable" id="centro" cx="150" cy="115" r="24" />
            </svg>
        </div>

        <!-- Paleta de colores interactiva -->
        <div class="flex justify-center items-center gap-2.5 flex-wrap mb-4">
            <button class="color-btn w-9 h-9 rounded-full border-2 border-gray-300 shadow-md transition transform hover:scale-110 active:scale-95 ring-2 ring-pink-500" style="background-color: #ec4899;" data-color="#ec4899"></button>
            <button class="color-btn w-9 h-9 rounded-full border-2 border-gray-300 shadow-md transition transform hover:scale-110 active:scale-95" style="background-color: #8b5cf6;" data-color="#8b5cf6"></button>
            <button class="color-btn w-9 h-9 rounded-full border-2 border-gray-300 shadow-md transition transform hover:scale-110 active:scale-95" style="background-color: #3b82f6;" data-color="#3b82f6"></button>
            <button class="color-btn w-9 h-9 rounded-full border-2 border-gray-300 shadow-md transition transform hover:scale-110 active:scale-95" style="background-color: #10b981;" data-color="#10b981"></button>
            <button class="color-btn w-9 h-9 rounded-full border-2 border-gray-300 shadow-md transition transform hover:scale-110 active:scale-95" style="background-color: #f59e0b;" data-color="#f59e0b"></button>
            <button class="color-btn w-9 h-9 rounded-full border-2 border-gray-300 shadow-md transition transform hover:scale-110 active:scale-95" style="background-color: #ef4444;" data-color="#ef4444"></button>
            <button class="color-btn w-9 h-9 rounded-full border-2 border-gray-300 shadow-md transition transform hover:scale-110 active:scale-95" style="background-color: #ffffff;" data-color="#ffffff" title="Borrador"></button>
        </div>

        <!-- Mensaje de éxito al completar -->
        <div id="mensaje-victoria" class="hidden mt-4 p-3 bg-green-50 border border-green-200 text-green-700 rounded-xl font-medium text-sm animate-bounce">
            ✨ ¡Increíble! Has completado tu obra de arte de forma impecable 🎉
        </div>
    </div>

    <!-- Script de lógica interactiva -->
    <script>
        let colorActual = "#ec4899";
        let historial = [];
        let rehacelist = [];

        const zonas = document.querySelectorAll('.zona-pintable');
        const colorBtns = document.querySelectorAll('.color-btn');
        const mensajeVictoria = document.getElementById('mensaje-victoria');

        // Manejador de selección de color
        colorBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                colorBtns.forEach(b => b.classList.remove('ring-2', 'ring-pink-500'));
                btn.classList.add('ring-2', 'ring-pink-500');
                colorActual = btn.getAttribute('data-color');
            });
        });

        // Evento click en cada zona interactiva de la flor
        zonas.forEach(zona => {
            zona.addEventListener('click', (e) => {
                e.stopPropagation();
                
                let colorAnterior = zona.style.fill;
                if (!colorAnterior || colorAnterior === "") {
                    colorAnterior = "#ffffff";
                }

                // Registrar en historial si el color cambia
                if (colorAnterior.toLowerCase() !== colorActual.toLowerCase()) {
                    historial.push({ zona: zona, colorAnterior: colorAnterior, colorNuevo: colorActual });
                    rehacelist = []; // Limpiar rehacer al realizar una nueva acción

                    zona.style.fill = colorActual;
                    verificarProgreso();
                }
            });
        });

        function deshacer() {
            if (historial.length === 0) return;
            const ultimaAccion = historial.pop();
            rehacelist.push(ultimaAccion);
            ultimaAccion.zona.style.fill = ultimaAccion.colorAnterior;
            verificarProgreso();
        }

        function rehacer() {
            if (rehacelist.length === 0) return;
            const accionRedo = rehacelist.pop();
            historial.push(accionRedo);
            accionRedo.zona.style.fill = accionRedo.colorNuevo;
            verificarProgreso();
        }

        function reiniciar() {
            zonas.forEach(zona => {
                zona.style.fill = '#ffffff';
            });
            historial = [];
            rehacelist = [];
            mensajeVictoria.classList.add('hidden');
        }

        function verificarProgreso() {
            let pintadas = 0;
            zonas.forEach(zona => {
                let currentFill = zona.style.fill;
                if (currentFill && currentFill !== '#ffffff' && currentFill !== 'rgb(255, 255, 255)' && currentFill !== 'white') {
                    pintadas++;
                }
            });

            // Si todas las zonas (tallo, 2 hojas, 6 pétalos y centro = 10 zonas) están pintadas
            if (pintadas === zonas.length) {
                mensajeVictoria.classList.remove('hidden');
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 }
                });
            } else {
                mensajeVictoria.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
